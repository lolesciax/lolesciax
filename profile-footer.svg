<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Let's build something useful.</title>
  <desc id="desc">A black and platinum contact card with orbiting silver particles and a floating invitation. Open to collaboration and opportunities to grow. Email galveleolawrence@gmail.com.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#1A1A1A"/><stop offset="1" stop-color="#060606"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#FFFFFF" stop-opacity=".12"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="silver" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#A3A3A3"/></linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="268" rx="24"/></clipPath>
  </defs>
  <style>
    .orbit {transform-origin:989px 136px;animation:orbit 25s linear infinite}
    .orbit-back {transform-origin:989px 136px;animation:orbit 38s linear reverse infinite}
    .light {animation:breathe 7s ease-in-out infinite}
    .invite {animation:float 8s ease-in-out infinite}
    @keyframes orbit {to{transform:rotate(360deg)}}
    @keyframes breathe {0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media(max-width:600px){.art{display:none}.copy{transform:translate(-10px,-8px) scale(1.2)}.subtitle{font-size:32px}}
    @media(prefers-reduced-motion:reduce){.orbit,.orbit-back,.light,.invite{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="270" fill="url(#base)"/>
    <g class="art">
      <ellipse class="light" cx="989" cy="136" rx="240" ry="190" fill="url(#glow)"/>
      <g fill="none" stroke="#FFFFFF"><ellipse cx="989" cy="136" rx="171" ry="109" stroke-opacity=".12" transform="rotate(-28 989 136)"/><ellipse cx="989" cy="136" rx="143" ry="128" stroke-opacity=".07" transform="rotate(35 989 136)"/></g>
      <g class="orbit"><circle cx="989" cy="11" r="4" fill="#CFCFCF"/><circle cx="989" cy="261" r="2" fill="#707070"/></g>
      <g class="orbit-back"><circle cx="850" cy="136" r="2.5" fill="#B8B8B8"/></g>
      <g class="invite"><rect x="873" y="106" width="232" height="61" rx="18" fill="url(#silver)"/><text x="911" y="144" fill="#171717" font-family="Arial" font-size="23" font-weight="700">Say hello</text><path d="M1051 142L1066 127M1052 127H1066V141" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"/></g>
    </g>
    <g class="copy" font-family="Arial, Helvetica, sans-serif">
      <text x="48" y="58" fill="#A3A3A3" font-size="16">A conversation is a good place to start.</text>
      <text x="46" y="116" fill="#EEEEEE" font-size="43" font-weight="700" letter-spacing="-1.3">Let's build something useful.</text>
      <text class="subtitle" x="48" y="160" fill="#B8B8B8" font-size="22">Open to collaboration and opportunities to grow.</text>
      <text x="48" y="215" fill="#CFCFCF" font-size="20">galveleolawrence@gmail.com</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="269" rx="24" fill="none" stroke="#404040"/>
</svg>
