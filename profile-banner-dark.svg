<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Leo Lawrence Galve — Full-stack developer</title>
  <desc id="desc">A charcoal and silver banner with flowing waves, a subtle grid, and a code window. Clean interfaces. Useful software.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#080808"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <linearGradient id="silver" x2="1" y2="0">
      <stop stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#A3A3A3"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="16" fill="url(#background)"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>
  <path d="M0 340C240 260 410 398 690 330S1040 300 1200 270V400H0Z" fill="#343434" opacity=".5"/>
  <path d="M0 360C280 300 440 415 760 350S1050 330 1200 316V400H0Z" fill="#181818"/>
  <path d="M0 360C280 300 440 415 760 350S1050 330 1200 316" fill="none" stroke="#FFFFFF" stroke-opacity=".14"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="101" fill="#ADADAD" font-size="20">Hi, I'm</text>
    <text x="56" y="170" fill="url(#silver)" font-size="59" font-weight="700" letter-spacing="-2.5">Leo Lawrence Galve.</text>
    <text x="60" y="215" fill="#D4D4D4" font-size="27">Full-stack developer</text>
    <path d="M60 244H116" stroke="#D4D4D4" stroke-width="2"/>
    <text x="60" y="283" fill="#B8B8B8" font-size="23">Clean interfaces. Useful software.</text>
  </g>
  <g transform="translate(770 80)">
    <rect width="366" height="224" rx="12" fill="#101010" stroke="#484848"/>
    <path d="M0 42H366" stroke="#333333"/>
    <g fill="#737373">
      <circle cx="22" cy="22" r="4"/>
      <circle cx="38" cy="22" r="4"/>
      <circle cx="54" cy="22" r="4"/>
    </g>
    <text x="341" y="27" text-anchor="end" fill="#A3A3A3" font-family="Consolas, monospace" font-size="12">about.ts</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="17">
      <text x="24" y="79" fill="#8C8C8C">// a little about me</text>
      <text x="24" y="111" fill="#D4D4D4">const <tspan fill="#FAFAFA">leo</tspan> = {</text>
      <text x="44" y="142" fill="#A3A3A3">build: <tspan fill="#E5E5E5">'web + mobile'</tspan>,</text>
      <text x="44" y="173" fill="#A3A3A3">care: <tspan fill="#E5E5E5">'the details'</tspan></text>
      <text x="24" y="204" fill="#D4D4D4">};</text>
    </g>
  </g>
</svg>
